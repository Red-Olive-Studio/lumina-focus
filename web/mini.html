<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Lumina mini</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="mini.js"></script>
</head>
<body class="pip" data-phase="focus">
<div class="pill">
  <div class="prow" id="normal">
    <span class="dot"></span>
    <b id="time">25:00</b>
    <span id="next" class="pnext"></span>
    <button id="brk" class="icon" title="Take a break now" aria-label="Take a break now">
      <svg class="i-brk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 3v2.5M12 3v2.5"/></svg>
      <svg class="i-foc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>
    </button>
    <button id="toggle" class="icon go" aria-label="Start or pause">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
    <button id="open" class="icon" title="Open Lumina" aria-label="Open Lumina">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
    </button>
  </div>
  <p id="msay" role="alert" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></p>
  <div class="prow palert" id="alert" hidden>
    <span id="aicon" class="aicon" aria-hidden="true"></span>
    <b id="atext"></b>
    <span id="acts"></span>
    <button id="ok" class="icon" title="Dismiss" aria-label="Dismiss">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
    </button>
  </div>
</div>
</body>
</html>
